source: https://github.com/brainfish-ai/brainfish-mcp-server
docs: https://www.brainfishai.com/integrations/claude-mcp
server:
  name: brainfish
  transport: http
  url: https://mcp.brainfi.sh
  auth:
    - method: oauth2.1
      description: >-
        One-click OAuth in Claude.ai (Settings -> Integrations). Authorization Code
        + PKCE (S256) with dynamic client registration.
      authorization_endpoint: https://mcp.brainfi.sh/authorize
      token_endpoint: https://mcp.brainfi.sh/token
      registration_endpoint: https://mcp.brainfi.sh/register
      scopes: [mcp]
      well_known:
        - well-known/brainfish-mcp-oauth-authorization-server.json
        - well-known/brainfish-mcp-oauth-protected-resource.json
    - method: bearer
      description: >-
        API-token bearer auth for Claude Desktop / Cursor / VS Code via config file.
        Token format bf_api_. An agent-key is additionally required for answer tools.
      token_format: bf_api_
