openapi: 3.2.0
info:
  title: Brainfish Public Catalogs API
  description: The Brainfish API is organized around REST.
  version: 1.0.0
  contact:
    name: Brainfish API Support
    email: support@brainfish.ai
    url: https://help.brainfi.sh/articles/api-reference-7mjzVCAmeM
  license:
    name: Proprietary
servers:
- url: https://api.brainfi.sh
  description: Production server
tags:
- name: Catalogs
  description: Catalog management operations. Create catalogs and sync content programmatically via the API.
paths:
  /v1/catalogs:
    get:
      summary: List catalogs
      description: List all catalogs for the authenticated user's team. Supports filtering by source type and status, with pagination.
      operationId: listCatalogs
      tags:
      - Catalogs
      security:
      - BearerAuth: []
      parameters:
      - name: source
        in: query
        description: Filter by catalog source type
        schema:
          type: string
          enum:
          - cms
          - website
          - zendesk
          - github
          - discovery
          - helpscout
          - readme
          - readmev2
          - oas
          - notion
          - intercom
          - freshdesk
          - helpjuice
          - googledrive
          - confluence
          - guru
          - external
      - name: status
        in: query
        description: Filter by catalog status
        schema:
          type: string
          enum:
          - inprogress
          - completed
          - failed
      - name: limit
        in: query
        description: Maximum number of results to return (1-100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: offset
        in: query
        description: Offset for pagination
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: List of catalogs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListResponse'
              example:
                data:
                - id: cat-123
                  name: Developer Docs
                  source: external
                  status: completed
                  enabled: true
                  contentCount: 42
                  createdAt: '2024-01-10T08:00:00Z'
                  updatedAt: '2024-01-15T10:30:00Z'
                pagination:
                  offset: 0
                  limit: 25
                  total: 3
                timestamp: '2024-01-15T10:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create catalog
      description: 'Create a new catalog. A catalog is a container for content that can be synced via the API.


        After creating a catalog, use the sync endpoint (`POST /v1/catalogs/{id}/content`) to push content into it.'
      operationId: createCatalog
      tags:
      - Catalogs
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogRequest'
            examples:
              externalCatalog:
                summary: Create an external catalog
                value:
                  name: Developer Documentation
                  source: external
                  slug: dev-docs
              customConfig:
                summary: Create catalog with custom configuration
                value:
                  name: Internal Wiki
                  source: external
                  slug: internal-wiki
                  configurations:
                    repo: acme/docs
                    branch: main
      responses:
        '200':
          description: Catalog created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
              example:
                data:
                  id: cat-123
                  name: Developer Documentation
                  source: external
                  status: inprogress
                  enabled: true
                  createdAt: '2024-01-15T10:30:00Z'
                  updatedAt: '2024-01-15T10:30:00Z'
                timestamp: '2024-01-15T10:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/catalogs/{id}:
    get:
      summary: Get catalog
      description: Retrieve a catalog by its ID, including a count of content entries.
      operationId: getCatalog
      tags:
      - Catalogs
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Catalog ID (UUID)
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Catalog details with content count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDetailResponse'
              example:
                data:
                  id: cat-123
                  name: Developer Documentation
                  source: external
                  status: completed
                  enabled: true
                  contentCount: 42
                  createdAt: '2024-01-10T08:00:00Z'
                  updatedAt: '2024-01-15T10:30:00Z'
                timestamp: '2024-01-15T10:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/catalogs/{id}/content:
    post:
      summary: Sync content to catalog
      description: 'Sync content files to a catalog. This performs a **full sync**:


        - **New files** are created as catalog content entries

        - **Changed files** (different content or title) are updated

        - **Missing files** (present in catalog but not in request) are removed


        Each file is identified by its `url`, which acts as a unique key within the catalog.


        This endpoint is designed for large documentation sets (1000+ files) and uses batched database operations for performance.'
      operationId: syncCatalogContent
      tags:
      - Catalogs
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Catalog ID (UUID)
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCatalogContentRequest'
            examples:
              simpleSync:
                summary: Sync markdown documentation
                value:
                  files:
                  - url: https://docs.acme.com/getting-started
                    content: '# Getting Started


                      Welcome to our docs...'
                    title: Getting Started
                  - url: https://docs.acme.com/guides/authentication
                    content: '# Authentication


                      Learn how to authenticate...'
                    title: Authentication
                  - url: https://docs.acme.com/api/endpoints
                    content: '# API Endpoints


                      Available endpoints...'
                    title: API Endpoints
      responses:
        '200':
          description: Content synced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncCatalogContentResponse'
              example:
                data:
                  id: cat-123
                  name: Developer Documentation
                  source: external
                  status: completed
                  contentCount: 3
                  created: 2
                  updated: 1
                  removed: 0
                timestamp: '2024-01-15T10:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    CatalogListResponse:
      type: object
      required:
      - data
      - pagination
      - timestamp
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogWithCount'
        pagination:
          type: object
          required:
          - offset
          - limit
          - total
          properties:
            offset:
              type: integer
              example: 0
            limit:
              type: integer
              example: 25
            total:
              type: integer
              example: 3
        timestamp:
          type: string
          format: date-time
          description: Response timestamp
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Error type or code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error details
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
        requestId:
          type: string
          description: Unique request identifier for debugging
    CatalogDetailResponse:
      type: object
      required:
      - data
      - timestamp
      properties:
        data:
          $ref: '#/components/schemas/CatalogWithCount'
        timestamp:
          type: string
          format: date-time
          description: Response timestamp
    Catalog:
      type: object
      required:
      - id
      - name
      - source
      - status
      properties:
        id:
          type: string
          format: uuid
          description: Unique catalog identifier
          example: cat-123
        teamId:
          type: string
          format: uuid
          description: Team ID the catalog belongs to
        name:
          type: string
          description: Catalog name
          example: Developer Documentation
        source:
          type: string
          description: Catalog source type
          example: external
        status:
          type: string
          enum:
          - inprogress
          - completed
          - failed
          description: Current sync status
          example: completed
        enabled:
          type: boolean
          description: Whether the catalog is enabled
          example: true
        dailySync:
          type: boolean
          description: Whether daily sync is enabled
          example: false
        configurations:
          type: object
          additionalProperties: true
          description: Source-specific configuration (API keys are masked)
        createdBy:
          type: string
          format: uuid
          description: ID of the user who created the catalog
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        lastSyncError:
          type:
          - string
          - 'null'
          description: Last sync error message, if any
    CreateCatalogRequest:
      type: object
      required:
      - name
      - source
      properties:
        name:
          type: string
          description: Catalog name
          minLength: 1
          maxLength: 255
          example: Developer Documentation
        source:
          type: string
          description: Catalog source type
          enum:
          - cms
          - website
          - zendesk
          - github
          - discovery
          - helpscout
          - readme
          - readmev2
          - oas
          - notion
          - intercom
          - freshdesk
          - helpjuice
          - googledrive
          - confluence
          - guru
          - external
          example: external
        slug:
          type: string
          description: Unique slug for this catalog (used as an external identifier)
          minLength: 1
          maxLength: 100
          example: dev-docs
        configurations:
          type: object
          additionalProperties: true
          description: Optional source-specific configuration
    CatalogResponse:
      type: object
      required:
      - data
      - timestamp
      properties:
        data:
          $ref: '#/components/schemas/Catalog'
        timestamp:
          type: string
          format: date-time
          description: Response timestamp
    ValidationError:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          validationErrors:
            type: array
            items:
              type: object
              properties:
                field:
                  type: string
                  description: Field that failed validation
                message:
                  type: string
                  description: Validation error message
                code:
                  type: string
                  description: Validation error code
    SyncCatalogContentRequest:
      type: object
      required:
      - files
      properties:
        files:
          type: array
          minItems: 1
          description: Content files to sync
          items:
            type: object
            required:
            - url
            - content
            - title
            properties:
              url:
                type: string
                minLength: 1
                description: URL or path used as unique identifier within the catalog
                example: https://docs.acme.com/getting-started
              content:
                type: string
                description: File content (Markdown, MDX, plain text, etc.)
                example: '# Getting Started


                  Welcome to our docs...'
              title:
                type: string
                minLength: 1
                description: Content title
                example: Getting Started
    SyncCatalogContentResponse:
      type: object
      required:
      - data
      - timestamp
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/CatalogWithCount'
          - type: object
            properties:
              created:
                type: integer
                description: Number of new content entries created
                example: 2
              updated:
                type: integer
                description: Number of existing content entries updated
                example: 1
              removed:
                type: integer
                description: Number of stale content entries removed
                example: 0
        timestamp:
          type: string
          format: date-time
          description: Response timestamp
    CatalogWithCount:
      allOf:
      - $ref: '#/components/schemas/Catalog'
      - type: object
        properties:
          contentCount:
            type: integer
            description: Number of content entries in the catalog
            example: 42
  responses:
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              summary: Missing authentication token
              value:
                error: authentication_required
                message: 'Authentication required. Use Authorization: Bearer <token> header'
                timestamp: '2024-01-15T10:30:00Z'
                requestId: req-abc123
            missingAgentKey:
              summary: Missing agent key
              value:
                error: authentication_required
                message: Agent key is required
                timestamp: '2024-01-15T10:30:00Z'
                requestId: req-def456
            invalidCredentials:
              summary: Invalid credentials
              value:
                error: authentication_required
                message: Invalid or missing authentication credentials
                timestamp: '2024-01-15T10:30:00Z'
                requestId: req-ghi789
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: An unexpected error occurred
            requestId: req-abc123
            timestamp: '2024-01-15T10:30:00Z'
    UnprocessableEntity:
      description: Invalid request format or unknown message type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            emptyQuery:
              summary: Empty query validation error
              value:
                error: validation_failed
                message: Request validation failed
                validationErrors:
                - field: query
                  message: Query cannot be empty
                  code: invalid_string
                timestamp: '2024-01-15T10:30:00Z'
                requestId: req-val123
            invalidConversationId:
              summary: Invalid conversation ID format
              value:
                error: validation_failed
                message: Request validation failed
                validationErrors:
                - field: conversationId
                  message: Invalid conversation ID format
                  code: invalid_string
                timestamp: '2024-01-15T10:30:00Z'
                requestId: req-val456
            queryTooLong:
              summary: Query exceeds maximum length
              value:
                error: validation_failed
                message: Request validation failed
                validationErrors:
                - field: query
                  message: Query must be 2000 characters or less
                  code: too_big
                timestamp: '2024-01-15T10:30:00Z'
                requestId: req-val789
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Request limit per time window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Time when rate limit resets (Unix timestamp)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limit_exceeded
            message: 'Too many requests. Rate limit: 25 requests per minute'
            timestamp: '2024-01-15T10:30:00Z'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Document not found
            timestamp: '2024-01-15T10:30:00Z'
            requestId: req-notfound123
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Token
      description: 'Bearer token authentication. Include your API token in the Authorization header.


        Example: `Authorization: Bearer bf_api_xxxxx`


        Create tokens in your Brainfish dashboard under Settings → API Tokens.

        '
    AccessToken:
      type: apiKey
      in: header
      name: access-token
      description: '**Deprecated**: Use Bearer authentication instead.


        Legacy access token header for backward compatibility. Must start with `bf_api_`.


        Create tokens in your Brainfish dashboard under Settings → API Tokens.

        '
    AgentKey:
      type: apiKey
      in: header
      name: agent-key
      description: 'Agent key identifier that specifies which AI agent/widget to use for the request.


        Find agent keys in your Brainfish dashboard under Agents. Click on any agent key to copy it.

        '
