aid: brainfish
name: Brainfish
description: >-
  Brainfish is an AI product-support platform for B2B SaaS companies, built in Sydney
  and deployed globally with US/EU/AU data residency. Its AI support agents resolve
  customer tickets across chat, email, in-product, Slack and Teams, grounding every
  answer in the company's real product knowledge rather than training on customer
  data. Brainfish exposes a REST Public API (https://api.brainfi.sh) to
  programmatically manage the knowledge base (collections, documents, catalogs),
  generate cited AI answers and follow-up questions, and pull session analytics,
  plus a remote Model Context Protocol (MCP) server and an embeddable browser widget
  suite. Backed by Prosus Ventures.
